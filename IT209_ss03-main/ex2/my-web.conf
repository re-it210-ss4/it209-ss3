server {
    listen 80;
    server_name <IP_ADDRESS_DROPLET>;

    root /var/www/my-web/html;
    index index.html;

    # Trang lỗi 404 tùy biến
    error_page 404 /404.html;

    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
