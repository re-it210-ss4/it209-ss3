<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal App - Trang thông tin nội bộ</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0530, #2d1b69, #4a2c8a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            color: #a29bfe;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            color: #d4c5f9;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: #a29bfe;
            color: #1a0530;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Internal App</h1>
        <p>Chào mừng đến trang thông tin nội bộ.</p>
        <span class="badge">Port 8090</span>
    </div>
</body>
</html>
