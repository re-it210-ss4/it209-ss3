<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta App - Trang kiểm thử ứng dụng</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            color: #00d2ff;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            color: #b0c4de;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: #00d2ff;
            color: #0f2027;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Beta App</h1>
        <p>Chào mừng đến trang kiểm thử ứng dụng.</p>
        <span class="badge">Port 8080</span>
    </div>
</body>
</html>
