# Server Block cho Beta App - Cổng 8080
server {
    listen 8080;
    server_name <IP_ADDRESS_DROPLET>;

    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server Block cho Internal App - Cổng 8090
server {
    listen 8090;
    server_name <IP_ADDRESS_DROPLET>;

    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
